<ng-container *transloco="let t">
<header class="camera-header">
    <h2 mat-dialog-title> {{ t('scanner.title') }} </h2>
    <button class="ui-button" type="button" mat-dialog-close> {{ t('common.close') }} </button>
</header>

<mat-dialog-content class="camera-content">
    @if (false) {
        <label class="camera-selector">
            <span> {{ t('scanner.device.label') }} </span>
            <select
                [value]="selectedCameraId()"
                [disabled]="loading() || processing()"
                (change)="selectCamera($event)"
            >
                @for (camera of cameras(); track camera.deviceId) {
                    <option [value]="camera.deviceId">
                        {{ camera.label }}
                    </option>
                }
            </select>
        </label>
    }

    <div
        class="preview"
        [hidden]="result() !== null"
        [attr.aria-busy]="loading() || processing()"
        (click)="manualCapture()"
    >
        <video #video autoplay muted playsinline [attr.aria-label]="t('scanner.previewLabel')"></video>

        @if (outlinePoints() && !loading() && !error()) {
            <svg
                class="card-outline"
                [class.ready]="previewDetection()?.detected"
                [attr.viewBox]="outlineViewBox()"
                preserveAspectRatio="xMidYMid meet"
                aria-hidden="true"
            >
                <polygon [attr.points]="outlinePoints()" />
            </svg>
        }

        @if (loading()) {
            <p class="preview-message" role="status"> {{ t('scanner.waitingAccess') }} </p>
        }

        @if (error()) {
            <p class="preview-message" role="alert">{{ error() }}</p>
        }
    </div>

    @if (result(); as card) {
        <div class="scan-result">
            <img [src]="card.normalizedImage" [alt]="t('scanner.captureAlt')" />
        </div>
    }

    <p class="scan-status" role="status" aria-live="polite">
        {{ progress() || t('scanner.guidance') }}
    </p>
</mat-dialog-content>

</ng-container>
