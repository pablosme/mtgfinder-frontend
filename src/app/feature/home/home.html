<section class="home" aria-labelledby="home-heading">
    <div class="home-intro">
        <p class="home-eyebrow">The card archive &amp; camera scanner</p>
        <div class="home-emblem" aria-hidden="true">
            <img src="icon2.png" alt="" />
        </div>
        <h1 id="home-heading">Sol Binder</h1>
        <p class="home-description">
            Discover Magic cards, explore oracle text,<br class="desktop-break" />

        </p>

    <app-card-search-input inputId="home-card-search" (cardSelected)="selectCard($event)" />
    <a class="home-syntax-link" routerLink="/search-syntax">Learn the search syntax</a>
</section>
