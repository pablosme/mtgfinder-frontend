<header *transloco="let t" class="site-header" [class.site-header--home]="isHome()">
    <div class="header-container">
        <a class="brand" routerLink="/" [attr.aria-label]="t('header.homeLabel')">
            <span class="brand-mark" aria-hidden="true">
                <img src="icon2.png" alt="" />
            </span>
            <span class="brand-name">{{ t('header.brand') }}</span>
        </a>

        @if (!isHome()) {
            <app-card-search-input
                class="header-search"
                inputId="header-card-search"
                (cardSelected)="selectCard($event)"
            />
        } @else {
            <span class="header-caption">{{ t('header.caption') }}</span>
        }

        <app-language-selector />
    </div>
</header>
