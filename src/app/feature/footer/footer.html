<ng-container *transloco="let t">
<footer class="footer-wrapper">
    <div class="footer-container">
        <div class="footer-brand">
            <div class="footer-title"> {{ t('header.brand') }} </div>
            <p class="footer-disclaimer">
                 {{ t('footer.disclaimer') }} </p>
        </div>

        <div class="footer-links">
            <a href="#" class="footer-link"> {{ t('footer.terms') }} </a>
            <a href="#" class="footer-link"> {{ t('footer.privacy') }} </a>
            <a routerLink="/search-syntax" class="footer-link"> {{ t('navigation.searchSyntax') }} </a>
            <a href="#" class="footer-link"> {{ t('footer.about') }} </a>
        </div>
    </div>
</footer>

</ng-container>
